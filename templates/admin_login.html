<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EduSort</title>
    
    <!-- Link styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body" style="background: linear-gradient(135deg, #090d16 0%, #0f172a 60%, #1e3a8a 100%);">

    <div class="auth-card" style="background: rgba(15, 23, 42, 0.85); border-color: rgba(255, 255, 255, 0.1); color: #ffffff;">
        <!-- Brand Logo Block -->
        <div class="auth-logo-block">
            <a href="/" style="text-decoration: none;">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EduSort Logo" style="background-color: #ffffff; padding: 2px;">
                <h2 style="color: #ffffff;">EduSort</h2>
            </a>
            <p style="color: #94a3b8;">College Control Room & Resolver Log</p>
        </div>

        <h3 class="auth-title" style="color: #ffffff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px;">🛠️ Administrative Portal</h3>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(category_filter=["error"]) %}
          {% if messages %}
            <div class="alert alert-error" style="background-color: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.3); color: #fca5a5;">
                <span>❌ {{ messages[0] }}</span>
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="email-input" style="color: #cbd5e1;">Admin Email Address</label>
                <input
                    type="email"
                    id="email-input"
                    class="form-control"
                    name="email"
                    placeholder="admin@velhightech.com"
                    style="background-color: rgba(30, 41, 59, 0.5); border-color: rgba(255, 255, 255, 0.15); color: #ffffff;"
                    required
                >
            </div>

            <div class="form-group" style="margin-bottom: 30px;">
                <label for="password-input" style="color: #cbd5e1;">Secure Access Password</label>
                <input
                    type="password"
                    id="password-input"
                    class="form-control"
                    name="password"
                    placeholder="••••••••"
                    style="background-color: rgba(30, 41, 59, 0.5); border-color: rgba(255, 255, 255, 0.15); color: #ffffff;"
                    required
                >
            </div>

            <button type="submit" class="btn-primary" style="width: 100%;">Verify & Authorize Login</button>
        </form>
        
        <a href="/" class="back-to-home" style="color: #94a3b8;">← Back to Home Page</a>
    </div>

</body>
</html>
