<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Restriction Error - EduSort</title>
    
    <!-- Link styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

    <div class="auth-card" style="text-align: center;">
        <!-- Brand Logo Block -->
        <div class="auth-logo-block">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EduSort Logo">
            <h2 style="color: var(--status-escalated);">Access Restricted</h2>
            <p>Vel Tech Security Firewall</p>
        </div>

        <div class="alert alert-error" style="margin-bottom: 25px;">
            <span>❌ Invalid Email Domain</span>
        </div>

        <p style="font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 30px;">
            Sorry, you do not have permission to access the EduSort student portal. 
            EduSort is restricted exclusively to valid <strong>@velhightech.com</strong> college student email accounts.
        </p>

        <a href="/student_login" class="btn-primary" style="width: 100%; text-decoration: none;">Try Login Again</a>
        
        <a href="/" class="back-to-home">← Return to Landing Page</a>
    </div>

</body>
</html>
